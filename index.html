<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Tierras de Valoria</title>
		<style>
@font-face {
	font-family: 'Valoria Display';
	src: url('Immortal.ttf') format('truetype');
	font-display: swap;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #141b1b;
	font-family: 'Valoria Display', Georgia, serif;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	position: fixed;
	inset: 0;
	background-color: #18201d;
	background-image: linear-gradient(180deg, rgba(11, 18, 17, 0.3), rgba(9, 14, 13, 0.62)), url('valoria_splash.png');
	background-position: center;
	background-repeat: no-repeat;
	background-size: cover;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	opacity: 0;
	transition: opacity 420ms ease;
	padding: 24px;
	box-sizing: border-box;
	text-align: center;
	z-index: 5;
}

#status-splash {
	display: none;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	position: relative;
	left: auto;
	right: auto;
	width: min(390px, 76vw);
	height: 18px;
	margin: 24px auto 0;
	appearance: none;
	border: 2px solid #e4c782;
	border-radius: 999px;
	background: rgba(15, 22, 18, 0.72);
	box-shadow: 0 2px 18px rgba(0, 0, 0, 0.4);
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background: rgba(15, 22, 18, 0.72);
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #a77732, #f3d78e);
	border-radius: 999px;
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #a77732, #f3d78e);
	border-radius: 999px;
}

#status-notice {
	max-width: min(620px, 88vw);
	background: rgba(31, 24, 18, 0.9);
	border-radius: 12px;
	border: 1px solid #c59e59;
	color: #fff4dd;
	font: 16px/1.45 Georgia, serif;
	line-height: 1.3;
	margin: 20px auto 0;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

.splash-brand {
	width: min(900px, 94vw);
	text-shadow: 0 3px 5px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 0, 0, 0.5);
}

.splash-kicker {
	margin: 0 0 12px;
	color: #e7d2a0;
	font: 14px/1.3 Georgia, serif;
	letter-spacing: 0.36em;
}

.splash-brand h1 {
	margin: 0;
	color: #fff1c7;
	font: clamp(42px, 8vw, 86px)/0.98 'Valoria Display', Georgia, serif;
	letter-spacing: 0.035em;
	-webkit-text-stroke: 1px rgba(74, 49, 25, 0.72);
}

.splash-rule {
	width: min(320px, 55vw);
	height: 2px;
	margin: 24px auto 16px;
	background: linear-gradient(90deg, transparent, #e7c779, transparent);
}

.splash-subtitle {
	margin: 0;
	color: #fff7e3;
	font: 16px/1.4 Georgia, serif;
	letter-spacing: 0.24em;
}

#loading-caption {
	margin-top: 12px;
	color: #fff2d2;
	font: 13px/1.3 Georgia, serif;
	letter-spacing: 0.08em;
	text-shadow: 0 2px 4px #000;
}

#status.is-visible {
	visibility: visible;
	opacity: 1;
}

#status.is-hidden {
	opacity: 0;
}

@media (max-height: 520px) {
	.splash-kicker { margin-bottom: 6px; }
	.splash-rule { margin: 12px auto 8px; }
	#status-progress { margin-top: 14px; }
}
		</style>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<div class="splash-brand">
				<p class="splash-kicker">CRÓNICAS DE UN REINO OLVIDADO</p>
				<h1>TIERRAS<br>DE VALORIA</h1>
				<div class="splash-rule"></div>
				<p class="splash-subtitle">EL DESTINO TE ESPERA</p>
			</div>
			<progress id="status-progress"></progress>
			<div id="loading-caption">Preparando el viaje…</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":14525932,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
// Cambia el identificador del PCK al publicar una nueva build para evitar que
// los navegadores reutilicen un paquete de juego anterior desde su caché.
GODOT_CONFIG.mainPack = 'index.pck?v=valoria-camp-layout-20261031-9';
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const loadingCaption = document.getElementById('loading-caption');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.classList.add('is-hidden');
			window.setTimeout(() => statusOverlay.remove(), 450);
			initializing = false;
			return;
		}
		statusOverlay.classList.add('is-visible');
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		loadingCaption.style.display = mode === 'progress' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					loadingCaption.textContent = 'Preparando el viaje · ' + Math.min(100, Math.round((current / total) * 100)) + ' %';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					loadingCaption.textContent = 'Preparando el viaje…';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
